name: Numerical Audit (ASan/UBSan + cppcheck + clang-tidy + valgrind)

# ─────────────────────────────────────────────────────────────────────────────
# AUD-CI-3 remediation (AUDIT_FIND.md) — items 38.1-38.5 (✅ in CLAUDE.md) were
# implemented as local `cmake --target audit` tooling but NEVER ran in CI. A
# regression of the exact class of bug the audit exists to catch (UB, leak,
# OOB read) could land undetected. This workflow closes that gap.
#
# WHY THIS RUNS HERE, AND ONLY HERE (canonical CI policy):
#   - Heavy build + ASan/UBSan + valgrind is expensive (multi-build, minutes,
#     not seconds). It runs on GitHub-hosted runners (`ubuntu-24.04`, same
#     label as build.yml), one container per target distro (matrix below:
#     Fedora, CachyOS, Arch, Ubuntu, Debian). AUD-CI-5 / AUD-CI-3:
#     the old self-hosted label `docker` no longer exists after the move to
#     GitHub as the single host, so every run sat queued 24h and was
#     cancelled — the gate never ran once.
#   - Trigger is intentionally narrow: pull_request -> main, and release tags.
#     NOT on every feature-branch push — that would make CI a bottleneck
#     (>10-20min gate people learn to skip) for a check whose whole point is
#     to gate the promotion to main/release, not every commit.
#   - Fast day-to-day feedback stays local: see scripts/pre-commit (ctest),
#     installed as a git hook — event-driven, no CI minutes spent.
#
# WHY THE MAIN BUILD IS *NOT* SANITizer-INSTRUMENTED HERE:
#   `cmake --target audit` already builds its OWN isolated ASan+UBSan build
#   in build_asan/ (see cmake/audit.cmake, item 38.1) and runs the test suite
#   there. That target is *intentionally* decoupled from the main build:
#   Valgrind (item 38.2) instruments the astrofind_tests binary from the
#   PLAIN (non-sanitized) main build. Running Valgrind against an
#   ASan-instrumented binary is unsupported and produces garbage results/
#   crashes (ASan and Valgrind's shadow-memory models collide). Keeping the
#   main build plain and letting audit-asan manage its own build_asan/ is
#   the only configuration where both checks are valid simultaneously.
#
# WHY THE JOB PARSES REPORTS INSTEAD OF TRUSTING THE TARGET'S EXIT CODE:
#   cmake/audit.cmake was written so `cmake --build build --target audit`
#   NEVER fails on its own (cppcheck --error-exitcode=0, clang-tidy piped
#   with `|| true`, valgrind --error-exitcode=0, asan test run piped with
#   `|| true`) — that lets a human run it locally and always get a full
#   report even when some checker finds something. CI must therefore be the
#   layer that turns "report exists" into "job fails on critical finding".
#   That gating logic lives in the "Gate on critical findings" step below.
#
# AUD-CI-7 — HONEST EXIT CODES: every tool in the matrix is REQUIRED (they are
#   all installed below), so a missing report is a gate FAILURE, never a
#   warning: "the checker did not run" must not look like "the checker found
#   nothing". clang-tidy is gated too: its report must show that it actually
#   analysed files (no "No compilation database", no run-clang-tidy Python
#   traceback — both happened silently in every run up to 2026-09-24), and
#   error-level lines (" error: ", i.e. code clang could not even parse, or a
#   check promoted to error) fail the job **when reported inside our own
#   src/**. clang-tidy WARNINGS (thousands of style/cppcoreguidelines hits)
#   stay non-blocking: they are in the uploaded report for humans, not a
#   merge gate.
#
# AUD-CI-7 follow-up (first real clang-tidy run on code, 2026-09-24, run
#   36070845327): `-header-filter` only hides clang-tidy CHECK diagnostics in
#   headers — it never hides core clang-diagnostic-error/warning lines. Every
#   spdlog::debug/info/warn call site in src/ triggered the SAME error inside
#   build/_deps/spdlog-src/include/spdlog/logger.h:334 (spdlog's own internal
#   SPDLOG_LOGGER_CATCH exception handler, not any format string our code
#   passes in): "call to consteval function ... is not a constant
#   expression". That is a confirmed, still-open clang x bundled-fmt
#   incompatibility upstream (clang rejects pointer arithmetic inside fmt's
#   compile-time FMT_STRING checker that GCC accepts) —
#   https://github.com/fmtlib/fmt/issues/4501 and
#   https://github.com/gabime/spdlog/issues/3306 — not an AstroFind bug, and
#   no spdlog/fmt release or macro fixes it yet. The gate therefore splits
#   error-level lines by WHERE they were reported: inside build/_deps/
#   (third-party code we do not own) never blocks, on any image; inside our
#   own src/ still blocks whenever tidy_gate=true, exactly as before.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]    # keeps the README Fedora/CachyOS/Audit badges live
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-audit:
    name: Numerical audit · ${{ matrix.image }} · ASan/UBSan + cppcheck + clang-tidy + valgrind
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    # Same audit on the five distros the project targets. fail-fast off: a
    # sanitizer hit on one toolchain must not hide what the others report.
    #   fedora:44            — the maintainer's development distro (dnf)
    #   cachyos/cachyos      — official CachyOS image (CachyOS repos and
    #                          toolchain, not Arch renamed); baseline x86-64
    #                          variant so it runs on any hosted runner CPU
    #   archlinux:latest     — upstream Arch, rolling (newest GCC/Qt)
    #   ubuntu:24.04         — LTS (apt)
    #   debian:12            — oldest Qt/GCC the project supports
    #
    # tidy_gate — whether clang-tidy ERRORS block the job on that image
    # (AUD-CI-7). It is false only where the distro's clang cannot parse this
    # C++23 code base with the distro's own GCC libstdc++, so every file would
    # "error" for toolchain reasons, not code reasons:
    #   debian:12    — clang-tidy 14 rejects -std=c++23 (spelling added in 17)
    #   ubuntu:24.04 — clang-tidy 18 predates __cpp_concepts >= 202002L, which
    #                  libstdc++ 13 requires to expose std::expected
    # There the error count is still printed and a missing/broken report still
    # fails; only the error lines are downgraded to a ::warning.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:44
            family: fedora
            tidy_gate: true
          - image: cachyos/cachyos:latest
            family: arch
            debuginfod: https://debuginfod.cachyos.org https://debuginfod.archlinux.org
            tidy_gate: true
          - image: archlinux:latest
            family: arch
            debuginfod: https://debuginfod.archlinux.org
            tidy_gate: true
          - image: ubuntu:24.04
            family: debian
            tidy_gate: false
          - image: debian:12
            family: debian
            tidy_gate: false

    container:
      image: ${{ matrix.image }}
      options: --user root

    env:
      DEBIAN_FRONTEND: noninteractive
      # Arch and CachyOS ship a stripped ld.so, so valgrind aborts at startup
      # ("a function redirection which is mandatory ... memcmp in
      # ld-linux-x86-64.so.2"). Valgrind >= 3.19 fetches the missing symbols
      # by build-id through debuginfod-find. Empty elsewhere: Fedora keeps
      # the symbols and apt pulls libc6-dbg in as a valgrind recommendation.
      DEBUGINFOD_URLS: ${{ matrix.debuginfod }}

    steps:
      # Slug for cache key and artifact name; first so a failed install still
      # uploads under the right name.
      - name: "Cache key"
        id: key
        run: echo "slug=$(echo '${{ matrix.image }}' | tr '/:' '--')" >> "$GITHUB_OUTPUT"

      # ── 1. SYSTEM INFO ──────────────────────────────────────────────────────
      - name: "System information"
        run: |
          echo "AstroFind — Numerical Audit (AUD-CI-3) on ${{ matrix.image }}"
          cat /etc/os-release
          nproc
          # minimal images may ship without procps
          free -h 2>/dev/null || grep -E "MemTotal|MemAvailable" /proc/meminfo

      # ── 2. INSTALL TOOLCHAIN + AUDIT TOOLS ──────────────────────────────────
      # Fedora ships Qt Network/Sql/Xml/Concurrent/OpenGL inside
      # qt6-qtbase-devel and needs libasan/libubsan separately; on Arch and
      # CachyOS the sanitizer runtimes come with gcc and clang-tidy with clang.
      # zlib dev files: QuaZip (pulled in because Core5Compat is installed)
      # needs them, and minimal Fedora/Debian images do not ship them. Not
      # listed for pacman: zlib-ng-compat (already in the Arch/CachyOS base)
      # provides zlib with headers, and naming zlib conflicts with it.
      - name: "Install build + audit toolchain (dnf)"
        if: matrix.family == 'fedora'
        run: |
          dnf install -y \
            cmake ninja-build gcc-c++ libasan libubsan procps-ng git pkgconf-pkg-config file unzip \
            qt6-qtbase-devel qt6-qtcharts-devel \
            qt6-qttools-devel qt6-qt5compat-devel \
            cfitsio-devel fftw-devel libarchive-devel zlib-devel LibRaw-devel \
            mesa-libGL-devel libxkbcommon-devel \
            clang-tools-extra cppcheck valgrind

      - name: "Install build + audit toolchain (pacman)"
        if: matrix.family == 'arch'
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja gcc git pkgconf file procps-ng unzip \
            qt6-base qt6-charts qt6-tools qt6-5compat \
            cfitsio fftw libarchive libraw \
            mesa libxkbcommon \
            clang cppcheck valgrind debuginfod
          # Which repo the C library came from matters for valgrind symbols
          # (CachyOS rebuilds glibc; Arch symbols do not match that build).
          pacman -Qi glibc | grep -E "^(Version|Packager|Build Date)"

      - name: "Install build + audit toolchain (apt)"
        if: matrix.family == 'debian'
        run: |
          apt-get update
          apt-get install -y \
            cmake ninja-build gcc g++ git pkg-config file procps unzip \
            qt6-base-dev libqt6charts6-dev libqt6opengl6-dev \
            qt6-tools-dev qt6-tools-dev-tools libqt6core5compat6-dev \
            libcfitsio-dev libfftw3-dev libarchive-dev zlib1g-dev libraw-dev \
            libgl1-mesa-dev libxkbcommon-dev \
            clang-tidy cppcheck valgrind

      - name: "Toolchain versions"
        run: |
          echo -n "cmake:      "; cmake --version | head -1
          echo -n "gcc:        "; gcc --version | head -1
          echo -n "cppcheck:   "; cppcheck --version
          echo -n "clang-tidy: "; clang-tidy --version | grep -i version | head -1
          echo -n "valgrind:   "; valgrind --version

      # ── 3. CHECKOUT ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 4. FETCHCONTENT CACHE ────────────────────────────────────────────────
      # Keyed per image: _deps holds sources plus sub-builds made by that
      # distro's compiler, so they must not be shared across the matrix.
      - name: "Restore FetchContent cache"
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-audit-${{ steps.key.outputs.slug }}-${{ hashFiles('cmake/dependencies.cmake') }}
          restore-keys: fetchcontent-audit-${{ steps.key.outputs.slug }}-

      # ── 5. CONFIGURE (plain build — required for a valid valgrind run) ──────
      - name: "CMake configure"
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          echo ""
          grep -E "Qt6|CFITSIO|FFTW|ARCHIVE|CMAKE_CXX_COMPILER|BUILD_TYPE|EXPORT_COMPILE" \
            build/CMakeCache.txt | sort
          # clang-tidy (38.4) is useless without the database (AUD-CI-7).
          test -s build/compile_commands.json \
            || { echo "::error::build/compile_commands.json was not generated."; exit 1; }
          # AUD-MEM-gaps: ImageStacker.cpp includes <fftw3.h>; clang-tidy must
          # see it, or that file is skipped with a clang-diagnostic-error.
          grep -q 'ImageStacker.cpp' build/compile_commands.json

      # ── 6. BUILD ──────────────────────────────────────────────────────────────
      - name: "Build"
        run: cmake --build build --parallel

      # ── 7. BASELINE ctest (plain build — fast sanity gate) ───────────────────
      - name: "ctest (plain build, 116 core + 23 UI cases)"
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      # ── 8. FULL AUDIT (items 38.1-38.5): cppcheck + clang-tidy + valgrind +
      #       ASan/UBSan (own isolated build_asan/, see cmake/audit.cmake) ────
      - name: "cmake --build build --target audit"
        run: |
          cmake --build build --target audit
          echo ""
          echo "=== Reports written to build/audit/ ==="
          ls -la build/audit/ || true

      # ── 9. GATE — turn "report exists" into "job fails on critical finding"
      #       (see header comment: the cmake target intentionally never fails
      #       on its own so a human can always get a full report locally) ────
      - name: "Gate on critical findings"
        if: always()
        run: |
          set +e
          FAIL=0

          echo "── ASan/UBSan (build_asan/bin/astrofind_tests) ──────────────"
          if [ -f build/audit/asan_tests.txt ]; then
            cat build/audit/asan_tests.txt
            if grep -qiE \
              'ERROR: (Address|LeakSanitizer|UndefinedBehavior)|runtime error:|SUMMARY: (Address|UndefinedBehavior)Sanitizer|FAILED' \
              build/audit/asan_tests.txt; then
              echo "::error::ASan/UBSan reported an error or a test FAILED under sanitizers."
              FAIL=1
            else
              echo "OK — no sanitizer error, no failed test."
            fi
          else
            echo "::error::build/audit/asan_tests.txt not produced — audit-asan target did not run."
            FAIL=1
          fi

          echo ""
          echo "── cppcheck (severity=error) ─────────────────────────────────"
          if [ -f build/audit/cppcheck.xml ]; then
            ERR_COUNT=$(grep -c 'severity="error"' build/audit/cppcheck.xml || true)
            echo "cppcheck severity=error findings: ${ERR_COUNT:-0}"
            if [ "${ERR_COUNT:-0}" -gt 0 ]; then
              grep 'severity="error"' build/audit/cppcheck.xml
              echo "::error::cppcheck found ${ERR_COUNT} critical (severity=error) issue(s)."
              FAIL=1
            fi
          else
            echo "::error::build/audit/cppcheck.xml not produced — cppcheck is required (installed above) and did not run."
            FAIL=1
          fi

          echo ""
          echo "── clang-tidy (src/ errors block when tidy_gate; _deps/ errors and warnings never) ──"
          TIDY=build/audit/clang_tidy.txt
          if [ ! -f "$TIDY" ]; then
            echo "::error::$TIDY not produced — clang-tidy is required (installed above) and did not run."
            FAIL=1
          elif grep -qE 'No compilation database found|Error while trying to load a compilation database|Traceback \(most recent call last\)|Cannot combine fixes' "$TIDY"; then
            # The tool itself broke: nothing was analysed. Not a finding, but
            # never a pass either (this is what every run did before AUD-CI-7).
            head -40 "$TIDY"
            echo "::error::clang-tidy did not analyse any file (no compilation database / run-clang-tidy crashed)."
            FAIL=1
          else
            TIDY_WARN=$(grep -c ' warning: ' "$TIDY" || true)
            # AUD-CI-7 follow-up (see header comment): -header-filter does not
            # hide clang-diagnostic-error lines reported inside a header, so
            # an error line's PATH decides whether it is ours (project src/)
            # or a third-party FetchContent dependency (build/_deps/) we
            # cannot fix. Both counts always come back as a number ("0" on no
            # match) because `grep -c` prints the count even on a no-match
            # exit status 1 — the `|| true` guards only against $TIDY itself
            # being unreadable.
            TIDY_ERR_ALL=$(grep -c ' error: ' "$TIDY" || true)
            TIDY_ERR_DEPS=$(grep ' error: ' "$TIDY" | grep -c '/_deps/' || true)
            TIDY_ERR_SRC=$(( ${TIDY_ERR_ALL:-0} - ${TIDY_ERR_DEPS:-0} ))
            echo "clang-tidy: ${TIDY_ERR_ALL:-0} error line(s) total — ${TIDY_ERR_DEPS:-0} in build/_deps/ (third-party, never blocks), ${TIDY_ERR_SRC} in project src/; ${TIDY_WARN:-0} warning line(s) (warnings are non-blocking)"
            if [ "${TIDY_ERR_DEPS:-0}" -gt 0 ]; then
              grep ' error: ' "$TIDY" | grep '/_deps/' | sort | uniq -c | sort -rn | head -20
              echo "::warning::clang-tidy reported ${TIDY_ERR_DEPS} error line(s) inside build/_deps/ (known clang/bundled-fmt consteval incompatibility, see workflow header comment) — never blocks, on any image."
            fi
            if [ "${TIDY_ERR_SRC:-0}" -gt 0 ]; then
              grep ' error: ' "$TIDY" | grep -v '/_deps/' | sort | uniq -c | sort -rn | head -50
              if [ "${{ matrix.tidy_gate }}" = "true" ]; then
                echo "::error::clang-tidy reported ${TIDY_ERR_SRC} error-level finding(s) in project src/."
                FAIL=1
              else
                echo "::warning::clang-tidy reported ${TIDY_ERR_SRC} error line(s) in project src/ on ${{ matrix.image }} (tidy_gate=false: known clang/libstdc++ mismatch, see matrix comment)."
              fi
            fi
          fi

          echo ""
          echo "── valgrind memcheck (definite leaks / invalid access) ──────"
          if [ -f build/audit/valgrind.xml ]; then
            CRIT_COUNT=$(grep -cE \
              '<kind>(Leak_DefinitelyLost|InvalidRead|InvalidWrite|InvalidFree|MismatchedFree|UninitCondition)</kind>' \
              build/audit/valgrind.xml || true)
            echo "valgrind critical findings: ${CRIT_COUNT:-0}"
            if [ "${CRIT_COUNT:-0}" -gt 0 ]; then
              echo "::error::valgrind found ${CRIT_COUNT} critical memcheck issue(s) (definite leak / invalid access)."
              FAIL=1
            fi
            # A run that aborted (e.g. stripped ld.so, AUD-CI-3) leaves an XML
            # without the FINISHED status — that is "did not run", not "clean".
            if ! grep -q '<state>FINISHED</state>' build/audit/valgrind.xml; then
              echo "::error::valgrind.xml has no FINISHED status — memcheck aborted before the suite completed."
              FAIL=1
            fi
          else
            echo "::error::build/audit/valgrind.xml not produced — valgrind is required (installed above) and did not run."
            FAIL=1
          fi

          echo ""
          if [ "$FAIL" -ne 0 ]; then
            echo "Numerical audit gate: FAILED — see errors above."
            exit 1
          fi
          echo "Numerical audit gate: PASSED."

      # ── 10. KEEP THE REPORTS ─────────────────────────────────────────────────
      - name: "Upload audit reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports-${{ steps.key.outputs.slug }}
          path: build/audit/
          if-no-files-found: warn
