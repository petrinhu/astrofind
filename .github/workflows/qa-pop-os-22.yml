name: QA · Pop!_OS stand-in (ubuntu:24.04 base)

# ─────────────────────────────────────────────────────────────────────────────
# Item 55.7 — Build and test for Pop!_OS users on an Ubuntu 24.04 base
#             (ubuntu:24.04 container standing in for Pop!_OS — NOT 22.04)
#
# WHY POP!_OS 22.04:
#   Pop!_OS 22.04 is System76's Linux distribution, popular with hardware-aware
#   users and those who want a polished out-of-the-box Linux experience. It is
#   based on Ubuntu 22.04 LTS (Jammy Jellyfish) with System76-specific packages.
#
# IMAGE USED: ubuntu:24.04 (AUD-CI-6 — honest label)
#   There is no official Pop!_OS Docker image. Pop!_OS 22.04 itself sits on
#   Ubuntu 22.04, whose archive ships Qt 6.2.4 — below the Qt 6.4 AstroFind
#   requires (find_package(Qt6 6.4 REQUIRED)), so a real 22.04 base cannot
#   build AstroFind at all. This job therefore runs on ubuntu:24.04 (Qt 6.4.2,
#   GCC 13) as a stand-in for the Ubuntu-family toolchain a Pop!_OS user on
#   the current release (24.04 base) gets. No System76 PPA is added.
#
# LIMITATION: This is NOT Pop!_OS and NOT a 22.04 base. Pop!_OS-specific
#   components (Pop Shell / COSMIC, System76 firmware tools, System76 PPA)
#   are not present. It validates the Ubuntu 24.04 apt package set only.
#
# WHAT THIS JOB VALIDATES (item 55.7):
#   ✅  Qt 6.4.2 (Ubuntu 24.04 archive — the minimum supported Qt) compatibility
#   ✅  GCC 13 C++23 support (libstdc++ 13)
#   ✅  CMake configuration succeeds
#   ✅  All 116 core unit tests pass
#   ✅  All 23 UI integration tests pass (offscreen)
#   ✅  CCfits extraction from bundled originals/CCfits.tar.gz
#   ❌  Hardware-accelerated OpenGL — not tested
#   ❌  Pop Shell, System76 firmware tools, System76 PPA — not present
#   ❌  Ubuntu 22.04 base (Qt 6.2.4 < 6.4) — cannot build AstroFind, not tested
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  qa-pop-os-22:
    name: Pop!_OS stand-in · ubuntu:24.04 base (not 22.04) · apt · GCC 13
    runs-on: ubuntu-latest

    container:
      image: ubuntu:24.04
      options: --user root

    steps:

      # ── 1. SYSTEM INFORMATION ────────────────────────────────────────────────
      - name: "🖥  System information"
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo "  AstroFind QA — Pop!_OS stand-in (via ubuntu:24.04, not a 22.04 base)"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          uname -a
          cat /etc/os-release
          echo ""
          lscpu | grep -E "Architecture|Model name|CPU\(s\)|Thread|Socket"
          echo ""
          free -h
          df -h /
          echo ""

      # ── 2. UPDATE PACKAGE DATABASE ───────────────────────────────────────────
      - name: "🔄  Update package database"
        run: |
          apt-get update -qq
          echo ""
          echo "── Available Qt6 packages ──────────────────────────────────────"
          apt-cache search qt6 | grep -E "qt6-base|qt6-charts|qt6-opengl|qt6-tools" | sort
          echo ""

      # ── 3. INSTALL BUILD DEPENDENCIES ───────────────────────────────────────
      - name: "📦  Install build dependencies"
        run: |
          apt-get install -y \
            cmake \
            ninja-build \
            gcc \
            g++ \
            git \
            pkg-config \
            qt6-base-dev \
            libqt6charts6-dev \
            libqt6opengl6-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libcfitsio-dev \
            libfftw3-dev \
            libarchive-dev \
            libraw-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            qt6-l10n-tools \
            libqt6openglwidgets6 \
            file
          echo ""
          echo "── Installed package versions ──────────────────────────────────"
          echo -n "cmake:        "; cmake --version | head -1
          echo -n "gcc:          "; gcc --version | head -1
          echo -n "g++:          "; g++ --version | head -1
          echo    "qt6-base-dev: $(dpkg -l qt6-base-dev | tail -1 | awk '{print $3}')"
          echo    "cfitsio:      $(dpkg -l libcfitsio-dev | tail -1 | awk '{print $3}')"
          echo    "fftw3:        $(dpkg -l libfftw3-dev | tail -1 | awk '{print $3}')"
          echo    "libarchive:   $(dpkg -l libarchive-dev | tail -1 | awk '{print $3}')"
          echo ""

      # ── 4. CHECKOUT ──────────────────────────────────────────────────────────
      - name: "📥  Checkout source"
        uses: actions/checkout@v4

      # ── 5. FETCHCONTENT CACHE ────────────────────────────────────────────────
      - name: "💾  Restore FetchContent cache"
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-ubuntu-24-${{ hashFiles('cmake/dependencies.cmake') }}
          restore-keys: fetchcontent-ubuntu-24-

      # ── 6. CMAKE CONFIGURE ───────────────────────────────────────────────────
      - name: "⚙️   CMake configure"
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            --log-level=VERBOSE
          echo ""
          grep -E "Qt6|CFITSIO|FFTW|ARCHIVE|CMAKE_CXX_COMPILER|BUILD_TYPE|VERSION" \
            build/CMakeCache.txt | sort
          echo ""

      # ── 7. BUILD ─────────────────────────────────────────────────────────────
      - name: "🔨  Build (verbose)"
        run: |
          cmake --build build --verbose
          echo ""
          ls -lh build/bin/
          file build/bin/AstroFind
          ldd build/bin/AstroFind | grep -i qt
          echo ""

      # ── 8. CORE UNIT TESTS ───────────────────────────────────────────────────
      - name: "🧪  Core unit tests (116 cases, no display required)"
        run: |
          build/bin/astrofind_tests --reporter console --verbosity high
          echo ""

      # ── 9. UI INTEGRATION TESTS ─────────────────────────────────────────────
      - name: "🖼️   UI integration tests (23 cases, offscreen platform)"
        env:
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: "qt.qpa.*=false"
        run: |
          build/bin/astrofind_ui_tests --reporter console --verbosity high
          echo ""

      # ── 10. SUMMARY ──────────────────────────────────────────────────────────
      - name: "📋  Summary"
        if: always()
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo "  AstroFind QA — Pop!_OS stand-in (ubuntu:24.04 base) — DONE"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "Distro:  $(cat /etc/os-release | grep PRETTY_NAME | cut -d= -f2)"
          echo "GCC:     $(gcc --version | head -1)"
          echo "Qt6:     $(dpkg -l qt6-base-dev | tail -1 | awk '{print $3}')"
          echo "CMake:   $(cmake --version | head -1)"
          echo ""
          ls -lh build/bin/ 2>/dev/null || echo "  (build directory not found)"
          echo ""
